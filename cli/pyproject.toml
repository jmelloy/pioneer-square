[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pioneer-square"
version = "0.1.0"
description = "Pioneer Square unified CLI: one `pioneer` binary serving the HTTP backend, foreman, and worker."
requires-python = ">=3.11"
dependencies = [
    # Backend (HTTP server) — from backend/requirements.txt
    "cryptography",
    "fastapi",
    "uvicorn[standard]",
    "asyncpg",
    "psycopg2-binary",
    "sqlalchemy[asyncio]",
    "sqlmodel",
    "alembic",
    "python-multipart",
    "python-dotenv",
    "docker",
    # Shared across all three runtimes
    "websockets>=12.0",
    "httpx>=0.27",
    "anyio>=4.0",
    "anthropic[bedrock]>=0.49",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout",
    "pytest-xdist",
    "respx>=0.20",
    "anyio[trio]>=4.0",
    "ruff",
]
s3 = [
    "boto3>=1.26",
]

[project.scripts]
pioneer = "pioneer_cli.main:main"
# Backward-compatible aliases for the previous standalone entry points.
pioneer-worker = "pioneer_cli.main:worker_alias"
pioneer-foreman = "pioneer_cli.main:foreman_alias"

[tool.setuptools]
packages = ["pioneer_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
