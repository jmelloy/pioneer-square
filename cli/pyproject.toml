[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pioneer-square"
version = "2026.09.04+29740e9"
description = "Pioneer Square unified CLI: one `pioneer` binary serving the HTTP backend, foreman, and worker."
requires-python = ">=3.11"
dependencies = [
    # Backend (HTTP server) — from backend/requirements.txt
    "cryptography",
    "fastapi",
    "uvicorn[standard]",
    "asyncpg",
    "psycopg2-binary",
    "sqlalchemy[asyncio]",
    "sqlmodel",
    "alembic",
    "python-multipart",
    "python-dotenv",
    "docker",
    # DNS resolver also used outside the optional local dnsid-py integration.
    # dnsid-py 0.7.0 is installed editable from ../dnsid-py until it is published.
    "dnspython>=2.4",
    # Shared across all three runtimes
    "websockets>=12.0",
    "httpx>=0.27",
    "anyio>=4.0",
    "anthropic[bedrock]>=0.49",
    "boto3>=1.34",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout",
    "pytest-xdist",
    "respx>=0.20",
    "anyio[trio]>=4.0",
    "ruff",
]
# Enables worker awareness of macOS sleep/wake (see worker/pioneer_worker/sleep_monitor.py).
# Not required: the worker falls back to a no-op stub when this isn't installed.
macos = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
pioneer = "pioneer_cli.main:main"
# Backward-compatible aliases for the previous standalone entry points.
pioneer-worker = "pioneer_cli.main:worker_alias"
pioneer-foreman = "pioneer_cli.main:foreman_alias"

[tool.setuptools]
packages = ["pioneer_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
