[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pioneer-square-backend"
version = "0.1.0"
description = "Shared backend core for Pioneer Square (provides backend.foreman_core)."
requires-python = ">=3.11"
dependencies = [
    "anthropic[bedrock]>=0.49",
]

[project.optional-dependencies]
bedrock = []

[tool.setuptools]
packages = ["backend", "backend.foreman_core"]
package-dir = {"" = ".."}
