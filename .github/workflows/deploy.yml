name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC — assumes the terraform-created deploy role, no static keys
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ENVIRONMENT: staging # single tfstate today; wire a workspace/backend-key per env before adding prod.

jobs:
  # Build + push all three images at the commit SHA. Terraform (below) then
  # points every task definition at ${IMAGE_REPO}:${github.sha}.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, foreman, worker]
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/pioneer-square-${ENVIRONMENT}/${{ matrix.service }}:${{ github.sha }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target "${{ matrix.service }}" \
            --build-arg "PIONEER_VERSION=${{ github.sha }}" \
            --cache-from "type=gha,scope=${{ matrix.service }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.service }}" \
            -t "$IMAGE" \
            --push \
            .

  # Run alembic migrations as a one-off ECS task BEFORE terraform rolls the
  # services. The backend container is a plain `pioneer serve` (no startup
  # migration), so during the rolling deploy the new backend can come up
  # alongside the old one — ECS tears the old task down only after the new
  # one passes health checks, and neither of them races a schema upgrade.
  #
  # The targeted apply registers the migrate task-definition revision at the
  # new image tag. It also applies the ECS capacity launch template / ASG so
  # architecture changes (for example x86_64 -> Graviton/ARM64) have capacity
  # available before the one-off migration task is placed. Broader capacity-
  # provider tuning is applied only after migrations pass.
  migrate:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          # Unwrapped binary so `terraform output -raw` below yields clean values.
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Register migrate task definition and capacity launch template
        run: |
          terraform apply -auto-approve \
            -target=aws_launch_template.ecs_capacity \
            -target=aws_autoscaling_group.ecs_capacity \
            -target=aws_ecs_task_definition.migrate \
            -var="container_image_tag=${{ github.sha }}"

      - name: Run migration task and wait for completion
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          FAMILY=$(terraform output -raw ecs_migrate_task_definition_family)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          SG=$(terraform output -raw ecs_tasks_security_group_id)
          CAPACITY_PROVIDER=$(terraform output -raw ecs_capacity_provider_name)

          echo "Waiting for ASG-backed ECS capacity to register..."
          for i in {1..40}; do
            REGISTERED=$(aws ecs describe-clusters \
              --clusters "$CLUSTER" \
              --query 'clusters[0].registeredContainerInstancesCount' \
              --output text)
            if [ "${REGISTERED:-0}" -gt 0 ]; then
              echo "Registered ECS container instances: $REGISTERED"
              break
            fi
            if [ "$i" = 40 ]; then
              echo "No ECS container instances registered after waiting. Capacity provider bootstrap failed."
              exit 1
            fi
            sleep 15
          done

          RESULT=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$FAMILY" \
            --capacity-provider-strategy "capacityProvider=$CAPACITY_PROVIDER,weight=1" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}")

          TASK_ARN=$(echo "$RESULT" | jq -r '.tasks[0].taskArn // empty')
          if [ -z "$TASK_ARN" ]; then
            echo "run-task failed:"
            echo "$RESULT" | jq '.failures'
            exit 1
          fi
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          TASK=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN")
          EXIT_CODE=$(echo "$TASK" | jq -r '.tasks[0].containers[0].exitCode // empty')
          STOP_REASON=$(echo "$TASK" | jq -r '.tasks[0].stoppedReason // empty')

          echo "--- migration logs ---"
          LOG_GROUP=$(terraform output -raw ecs_migrate_log_group)
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "migrate/migrate/${TASK_ARN##*/}" \
            --start-from-head \
            --query 'events[].message' --output text || true
          echo "----------------------"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed (exit code: ${EXIT_CODE:-none}, stopped reason: $STOP_REASON)"
            exit 1
          fi

  # terraform apply is the single source of truth for the running task
  # definitions: it renders env (subnets, SGs, config) AND the image tag in one
  # revision and rolls the services. Replaces the old per-service
  # render/deploy-task-definition steps + the services' ignore_changes.
  apply:
    needs: migrate
    runs-on: ubuntu-latest
    # No `environment:` gate — that would change the OIDC subject to
    # environment:<name>, which var.github_oidc_allowed_refs (ref:refs/heads/*)
    # doesn't permit. To add an approval gate, also add
    # "environment:terraform-apply" to that allow-list in variables.tf.
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init # bucket/region are hardcoded in main.tf's backend block

      - name: Terraform apply
        run: terraform apply -auto-approve -var="container_image_tag=${{ github.sha }}"
