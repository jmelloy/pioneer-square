name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Push via the release-workflow deploy key: github-actions[bot] can't
          # be added to a user-repo ruleset bypass list, but "Deploy keys" can.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Compute version
        id: version
        run: |
          DATE="$(date -u +%Y.%m.%d)"
          SHA="$(git rev-parse --short HEAD)"
          # PEP 440-compliant version for the Python package (local version after '+').
          echo "version=${DATE}+${SHA}" >> "$GITHUB_OUTPUT"
          # Human-readable tag/release name (git tags don't require PEP 440).
          echo "tag=v${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Bump pyproject version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"${RELEASE_VERSION}\"/" cli/pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release ${RELEASE_TAG} [skip ci]"
          git push origin HEAD:main

      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | grep -q .; then
            echo "Tag ${RELEASE_TAG} already exists on remote, skipping tag push"
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --generate-notes
