name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Push via the release-workflow deploy key: github-actions[bot] can't
          # be added to a user-repo ruleset bypass list, but "Deploy keys" can.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Compute version
        id: version
        run: |
          DATE="$(date -u +%Y.%m.%d)"
          SHA="$(git rev-parse --short HEAD)"
          # PEP 440-compliant version for the Python package (local version after '+').
          echo "version=${DATE}+${SHA}" >> "$GITHUB_OUTPUT"
          # Human-readable tag/release name (git tags don't require PEP 440).
          echo "tag=v${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Bump pyproject version
        run: |
          sed -i -E 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' cli/pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin HEAD:main

      - name: Create and push tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists on remote, skipping tag push"
          else
            git tag "${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true