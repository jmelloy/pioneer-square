version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      worker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: typescript
        # TypeScript 7 also crashes typescript-eslint (typescript-estree touches removed
        # ts internals) and vue-tsc (requires a "lib/tsc" export TS7 no longer provides) at
        # runtime, not just a peer-dependency version mismatch. Re-enable once both packages
        # ship TS7-compatible releases. See docs/typescript-7-upgrade.md and issue #950.
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-dependencies:
        patterns:
          - "*"
