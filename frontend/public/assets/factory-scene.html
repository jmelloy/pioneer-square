<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factory floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0e1514; --panel:#152120; --ink:#e8dfd0; --muted:#98a39b; --line:#26403c;
  --accent:#e0914f; --accent-ink:#1a0f06; --teal:#4fd1b5;
  --display:"Pixelify Sans", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#ece5d8; --panel:#f6f1e7; --ink:#2b2420; --muted:#6c6154; --line:#d3c8b6;
    --accent:#a84e1c; --accent-ink:#fffaf2; --teal:#157a68;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#ece5d8; --panel:#f6f1e7; --ink:#2b2420; --muted:#6c6154; --line:#d3c8b6;
  --accent:#a84e1c; --accent-ink:#fffaf2; --teal:#157a68;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
.top{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font:700 22px/1 var(--display);margin:0 6px 0 0}
.top label{display:flex;gap:8px;align-items:center;color:var(--muted)}
.top input[type=range]{width:110px;accent-color:var(--accent)}
.top input[type=checkbox]{accent-color:var(--accent)}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:3px 5px}
.btn{font:inherit;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);padding:5px 12px;border-radius:4px;cursor:pointer}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
output{font:12.5px ui-monospace,Menlo,Consolas,monospace;min-width:2ch;text-align:right}
.stat{margin-left:auto;color:var(--muted);font:12.5px ui-monospace,Menlo,Consolas,monospace}
.grp{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.grp[hidden]{display:none}
#hout{display:block;width:calc(100% - 32px);margin:8px 16px 0;min-height:60px;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px}
#hout[hidden]{display:none}
main{display:flex;justify-content:center;padding:16px}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;max-width:none;border:1px solid var(--line)}
</style>
</head>
<body>
<header class="top">
  <h1>Factory floor</h1>
  <button id="play" class="btn" type="button">Pause</button>
  <label>Robots <input id="n" type="range" min="1" max="8" value="4"><output id="nv">4</output></label>
  <label><input id="edit" type="checkbox"> Edit prop heights</label>
  <span id="editbar" class="grp" hidden>
    <label>Brush height <input id="h" type="range" min="0" max="60" value="26"><output id="hv">26</output></label>
    <button id="copyh" class="btn" type="button">Copy heights</button>
  </span>
  <label><input id="zones" type="checkbox"> Show zones</label>
  <label>Scale <select id="scale"><option value="0">Fit</option><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select></label>
  <span class="stat" id="stat"></span>
</header>
<textarea id="hout" hidden readonly aria-label="Prop heights JSON"></textarea>
<main><canvas id="c" width="297" height="383" aria-label="Isometric factory room with robots walking between tables, coffee machine and task board"></canvas></main>

function list(chars){ const o=[]; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(chars.includes(kind(c,r))) o.push([c,r]); return o; }
function path(sc,sr,tc,tr){
  if(sc===tc&&sr===tr) return [];
  const prev=new Int32Array(COLS*ROWS).fill(-2), q=[sr*COLS+sc]; prev[sr*COLS+sc]=-1;
  for(let h=0;h<q.length;h++){
    const cur=q[h], c=cur%COLS, r=(cur-c)/COLS;
    if(c===tc&&r===tr){ const p=[]; let k=cur; while(prev[k]!==-1){ p.push([k%COLS,(k-k%COLS)/COLS]); k=prev[k]; } return p.reverse(); }

      const nc=c+d[0], nr=r+d[1];
      if(walk(nc,nr)&&prev[nr*COLS+nc]===-2){ prev[nr*COLS+nc]=cur; q.push(nr*COLS+nc); }

  }
  return null;
}

function pick(b){
  const cand=list(b.mode==="work"?"W":"CB");
  const taken=new Set(S.robots.filter(o=>o!==b&&o.tc>=0).map(o=>o.tc+","+o.tr));
  const free=cand.filter(t=>!taken.has(t[0]+","+t[1]));
  const pool=free.length?free:cand, t=pool[Math.floor(Math.random()*pool.length)];
  const p=path(Math.round(b.c),Math.round(b.r),t[0],t[1]);
  if(!p) return false;
  b.path=p; b.tc=t[0]; b.tr=t[1];
  if(!p.length) arrive(b);
  return true;
}
function step(dt){
  for(const b of S.robots){
    if(b.path.length){
      const t=b.path[0], dx=t[0]-b.c, dy=t[1]-b.r, d=Math.hypot(dx,dy), m=1.8*dt;
      b.yaw=Math.abs(dx)>Math.abs(dy)?(dx>0?0:2):(dy>0?1:3);
      if(d<=m){ b.c=t[0]; b.r=t[1]; b.path.shift(); if(!b.path.length) arrive(b); }
      else { b.c+=dx/d*m; b.r+=dy/d*m; }
    } else {
      b.wait-=dt; if(b.act||b.working) b.actT+=dt;
      if(b.wait<=0){
        b.act=null; b.working=false;
        if(b.tc===Math.round(b.c)&&b.tr===Math.round(b.r)) b.mode=b.mode==="work"?"break":"work";
        if(!pick(b)) b.wait=1;
      }
    }
  }
}

/* ---------- prop occlusion: a per-pixel depth buffer ----------
   Every pixel that belongs to a prop stores the depth (column + row) of the
   tile it stands on. A robot pixel is hidden where the buffer is deeper than
   the robot, so edges are crisp and follow the real prop shape. */
const DEP=new Int16Array(W*H);
let PM=null;   /* prop mask, filled once the mask image loads */
const maskImg=new Image();
function readMask(){
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(maskImg,0,0); const d=g.getImageData(0,0,W,H).data; PM=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++) PM[i]=d[i*4]>127?1:0;
}
/* benches as exact rectangles in tile space (column/row edges), top face at LIFT px above the floor */
const TABLES=[{c0:1.95,c1:3.94,r0:2.42,r1:8.94},{c0:5.84,c1:7.88,r0:2.59,r1:9.31}];
const LIFT=15, THICK=6;
const isTable=(c,r)=>(c>=1&&c<=3&&r>=1&&r<=8)||(c>=5&&c<=7&&r>=2&&r<=9);
const tp=(c,r)=>[ZN.ox+(c-r)*ZN.tw/2, ZN.oy+(c+r)*ZN.tw/4-LIFT];
const tileOf=(x,y,l)=>{ const u=(x-ZN.ox)/(ZN.tw/2), v=(y+l-ZN.oy)/(ZN.tw/4); return [(u+v)/2,(v-u)/2]; };
const HEIGHTS={"6,9":0,"11,3":22,"11,4":24,"12,4":30,"13,4":36,"10,5":12,"11,5":30,"12,5":38,"13,5":38,"10,6":12,"11,6":34,"12,6":44,"13,6":38,"11,7":30,"12,7":40,"13,7":34,"11,8":24,"12,8":30,"13,8":24,"12,9":20,"13,9":20,"12,10":16,"13,10":16,"12,11":14,"13,11":14,"11,12":16,"12,12":18,"13,12":18,"1,11":40,"2,11":24,"3,12":26,"4,12":18,"5,12":20,"4,13":26,"5,13":26,"6,13":26,"7,13":26,"8,13":26,"9,13":28,"10,13":28,"11,13":32,"12,13":32};
const HT=new Uint8Array(COLS*ROWS);
for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
  if(kind(c,r)!=="#"||isTable(c,r)) continue;
  const o=HEIGHTS[c+","+r]; HT[r*COLS+c]=o!==undefined?o:26;
}
function inConvex(p,x,y){
  let s=0;
  for(let i=0;i<p.length;i++){
    const a=p[i], b=p[(i+1)%p.length], cr=(b[0]-a[0])*(y-a[1])-(b[1]-a[1])*(x-a[0]);
    if(cr!==0){ const g=cr>0?1:-1; if(s===0) s=g; else if(g!==s) return false; }
  }
  return true;
}
function hexPoly(c,r,h){
  const hw=ZN.tw/2, hh=ZN.tw/4, tx=ZN.ox+(c-r)*hw, ty=ZN.oy+(c+r)*hh;
  return [[tx-hw,ty+hh],[tx-hw,ty+hh-h],[tx,ty-h],[tx+hw,ty+hh-h],[tx+hw,ty+hh],[tx,ty+2*hh]];
}
function raster(poly,d,clip,mask){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of poly){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
  for(let y=Math.max(0,Math.floor(y0));y<Math.min(H,Math.ceil(y1));y++)
    for(let x=Math.max(0,Math.floor(x0));x<Math.min(W,Math.ceil(x1));x++){
      if(!inConvex(poly,x+.5,y+.5)) continue;
      if(clip&&!inConvex(clip,x+.5,y+.5)) continue;
      if(mask&&!mask[y*W+x]) continue;
      if(DEP[y*W+x]<d) DEP[y*W+x]=d;
    }
}
function buildDepth(){
  DEP.fill(-100);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(kind(c,r)!=="#"||isTable(c,r)) continue;
    const h=HT[r*COLS+c]; if(h>0) raster(hexPoly(c,r,h),c+r,null,PM);
  }
  /* a bench pixel takes the depth of the footprint tile under it, so only
     robots truly behind that part of the bench are hidden */
  for(const T of TABLES){
    const q=[tp(T.c0,T.r0),tp(T.c1,T.r0),tp(T.c1,T.r1),tp(T.c0,T.r1)];
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const p of q){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]+THICK); }
    for(let y=Math.max(0,Math.floor(y0));y<Math.min(H,Math.ceil(y1));y++)
      for(let x=Math.max(0,Math.floor(x0));x<Math.min(W,Math.ceil(x1));x++){
        let hit=false;
        for(let l=LIFT-THICK;l<=LIFT;l++){
          const t=tileOf(x+.5,y+.5,l);
          if(t[0]>=T.c0&&t[0]<=T.c1&&t[1]>=T.r0&&t[1]<=T.r1){ hit=true; break; }
        }
        if(!hit) continue;
        const t=tileOf(x+.5,y+.5,LIFT);
        const cc=Math.min(T.c1-1e-6,Math.max(T.c0,t[0])), rr=Math.min(T.r1-1e-6,Math.max(T.r0,t[1]));
        const d=Math.floor(cc)+Math.floor(rr);
        if(DEP[y*W+x]<d) DEP[y*W+x]=d;
      }
  }
}

 [33, 81]], "SW": [[22, 62], [22, 61], [22, 61], [22, 62], [22, 61], [22, 62], [7, 66], [4, 68], [13, 53], [9, 60], [13, 51], [13, 46], [12, 50], [10, 56], [10, 56], [8, 68], [10, 58], [6, 68]], "NW": [[42, 62], [42, 61], [42, 61], [42, 62], [42, 61], [42, 62], [7, 66], [4, 65], [13, 58], [9, 62], [13, 57], [13, 53], [12, 56], [10, 59], [10, 59], [8, 69], [10, 62], [6, 67]], "NE": [[42, 72], [42, 71], [42, 71], [42, 72], [42, 71], [42, 72], [57, 66], [60, 65], [51, 58], [55, 62], [51, 57], [51, 53], [52, 56], [54, 59], [54, 59], [56, 69], [54, 62], [58, 67]]}}, "lamp": {"main": [255, 0, 255], "hi": [255, 128, 255]}, "shadow": {"boiler": [12, 4], "lanky": [8, 3], "cart": [15, 4]}};
const FW=META.FW, FH=META.FH, AX=META.AX, AY=META.AY;
const scr=document.createElement("canvas"); scr.width=FW; scr.height=FH;
const sg=scr.getContext("2d",{willReadFrequently:true});
const R=(x,y,w,h,c)=>{ sg.fillStyle=c; sg.fillRect(x,y,w,h); };
/* lamp pixels are baked as marker colors and recolored per mode: palette teal while working, amber on break */
const MODE={work:{main:[82,219,163],hi:[222,218,165]},"break":{main:[235,191,68],hi:[227,218,95]},busy:{main:[227,218,95],hi:[222,218,165]}};
const VARIANTS={};
function buildVariants(atlas){
  META.types.forEach((tp,t)=>{ for(let cw=0;cw<2;cw++){
    const c=document.createElement("canvas"); c.width=atlas.width; c.height=4*FH;
    const g=c.getContext("2d",{willReadFrequently:true});
    g.drawImage(atlas,0,(t*2+cw)*4*FH,atlas.width,4*FH,0,0,atlas.width,4*FH);
    const src=g.getImageData(0,0,c.width,c.height);
    for(const mode of ["work","break","busy"]){
      const out=new ImageData(new Uint8ClampedArray(src.data),src.width,src.height), d=out.data, m=MODE[mode];
      for(let i=0;i<d.length;i+=4){
        if(d[i+3]===0||d[i]!==255||d[i+2]!==255) continue;
        const q=d[i+1]===0?m.main:(d[i+1]===128?m.hi:null);
        if(q){ d[i]=q[0]; d[i+1]=q[1]; d[i+2]=q[2]; }
      }
      const c2=document.createElement("canvas"); c2.width=c.width; c2.height=c.height; c2.getContext("2d").putImageData(out,0,0);
      VARIANTS[tp+"|"+cw+"|"+mode]=c2;

}
const AN=META.anims, DIRN=META.dirs, NOTEC=["#e3da5f","#52dba3","#d1743b"];
function pickFrame(b,tm){
  if(b.path.length) return ["walk",Math.floor(tm*8+b.seed*3)%4];
  const t=b.actT;
  if(b.act==="coffee"){ const c=t%3.2; return ["coffee",c<0.8?0:c<1.8?1:c<2.8?2:3]; }
  if(b.act==="board"){ const c=t%3.4; return ["board",c<0.9?0:c<2.0?(Math.floor(t*5)%2?1:2):c<2.9?3:0]; }
  if(b.working) return ["work",Math.floor(tm*4+b.seed*3)%4];
  return ["idle",Math.floor(tm*1.5+b.seed*3)%2];
}
/* things in the robot's hand, drawn into the sprite layer so props can still hide them */
function overlays(an,f,h,tm,i){
  const hx=h[0], hy=h[1];
  if(an==="coffee"&&f>0){
    R(hx-2,hy-6,6,6,"#14131b"); R(hx-1,hy-5,4,4,"#dedaa5"); R(hx-1,hy-5,4,1,"#55312b"); R(hx+4,hy-5,2,3,"#14131b");
    const w=Math.floor((tm*5+i)%3);
    R(hx-1+(w===1?1:0),hy-9-w,1,2,"rgba(222,218,165,.7)"); R(hx+2-(w===2?1:0),hy-10-((w+1)%3),1,2,"rgba(222,218,165,.45)");
  } else if(an==="board"&&f===3){
    R(hx-3,hy-8,8,8,"#14131b"); R(hx-2,hy-7,6,6,NOTEC[i%3]); R(hx-1,hy-5,4,1,"rgba(20,19,27,.45)"); R(hx-1,hy-3,3,1,"rgba(20,19,27,.45)");
  } else if(an==="work"&&(f===1||f===3)){
    R(hx-2,hy-1,5,1,"#e3da5f"); R(hx,hy-3,1,5,"#e3da5f"); R(hx,hy-1,1,1,"#dedaa5");
  }
}
function besideTable(b){
  const cx=b.c+0.5, cy=b.r+0.5;
  for(const T of TABLES){
    if(cy>T.r0-0.6&&cy<T.r1+0.6&&cx<T.c0&&cx>T.c0-0.9) return true;   /* along the left edge */
    if(cx>T.c0-0.6&&cx<T.c1+0.6&&cy<T.r0&&cy>T.r0-0.9) return true;   /* past the far end */
  }
  return false;
}
function robot(b,i,tm){
  const p=zc(b.c,b.r), px=Math.round(p[0]), py=Math.round(p[1]), tp=META.types[b.type];
  const pf=pickFrame(b,tm), an=pf[0], f=pf[1], fi=AN[an].off+f;
  sg.clearRect(0,0,FW,FH);
  const sh=META.shadow[tp], w=sh[0], hh=Math.max(2,Math.round(sh[1]*0.8));
  for(let dy=-hh;dy<=hh;dy++){
    const half=Math.floor(w*Math.sqrt(1-(dy*dy)/((hh+0.5)*(hh+0.5))));
    R(AX-half,AY+dy-1,2*half+1,1,"rgba(20,19,27,.45)");
  }
  const lamp=(an==="work"&&(f===1||f===3))?"busy":b.mode;   /* lamps flash bright on every strike */
  sg.drawImage(VARIANTS[tp+"|"+b.cw+"|"+lamp],fi*FW,b.yaw*FH,FW,FH,0,0,FW,FH);
  overlays(an,f,META.anchors[tp][DIRN[b.yaw]][fi],tm,i);
  const bx=px-AX, by=py-AY, d=b.c+b.r+0.01+((b.working||besideTable(b))?1.1:0);   /* robots beside a bench edge stay in front of it */
  const id=sg.getImageData(0,0,FW,FH), data=id.data;
  for(let j=0;j<FH;j++){
    const wy=by+j; if(wy<0||wy>=H) continue;
    for(let k=0;k<FW;k++){
      const wx=bx+k; if(wx<0||wx>=W) continue;
      if(DEP[wy*W+wx]>d) data[(j*FW+k)*4+3]=0;
    }
  }
  sg.putImageData(id,0,0);
  ctx.drawImage(scr,bx,by);

/* ---------- table doohickeys: one per table spot, running while a robot works there ---------- */
const SPOTS={"1,3":[2.75,3.5,0],"8,4":[7.3,4.5,1],"1,6":[2.75,6.5,2],"8,7":[7.3,7.5,0],"3,10":[2.95,8.3,1],"7,10":[6.86,8.6,2]};
const dooImg=new Image();
function doohickey(it,tm){
  const p=it.p, tp=p[2], dir=(it.b.yaw+2)%4, f=Math.floor(tm*6+it.b.seed*5)%4;
  const x=Math.round(ZN.ox+(p[0]-p[1])*ZN.tw/2), y=Math.round(ZN.oy+(p[0]+p[1])*ZN.tw/4-LIFT);
  ctx.drawImage(dooImg,f*DMETA.FW,(tp*4+dir)*DMETA.FH,DMETA.FW,DMETA.FH,x-DMETA.AX,y-DMETA.AY,DMETA.FW,DMETA.FH);
  if(tp===1){
    const a=DMETA.puff[1][META.dirs[dir]];
    for(let k=0;k<3;k++){
      const ph=(tm*1.8+k/3+it.b.seed)%1;
      ctx.fillStyle="rgba(222,218,165,"+(0.65*(1-ph)).toFixed(2)+")";
      ctx.fillRect(x-DMETA.AX+a[0]+Math.round(Math.sin((tm+k)*3)),y-DMETA.AY+a[1]-Math.round(ph*9)-1,2,2);
    }
  }
}

/* ---------- editing overlay ---------- */
const COLORS={"-":"rgba(60,200,120,.18)","#":"rgba(235,70,70,.4)","W":"rgba(70,130,255,.5)","C":"rgba(255,150,40,.55)","B":"rgba(250,215,60,.55)"};
function overlay(){
  const hw=ZN.tw/2, hh=ZN.tw/4; ctx.lineWidth=1;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const k=kind(c,r); if(k===".") continue;
    const tx=ZN.ox+(c-r)*hw, ty=ZN.oy+(c+r)*hh;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx+hw,ty+hh); ctx.lineTo(tx,ty+2*hh); ctx.lineTo(tx-hw,ty+hh); ctx.closePath();
    ctx.fillStyle=(S.edit&&k==="#"&&!isTable(c,r))?`rgba(235,70,70,${0.12+HT[r*COLS+c]/60*0.55})`:COLORS[k]; ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.stroke();
  }
  if(S.edit){
    ctx.strokeStyle="#4fd1b5";
    for(const T of TABLES){ const q=[tp(T.c0,T.r0),tp(T.c1,T.r0),tp(T.c1,T.r1),tp(T.c0,T.r1)]; ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]); for(const p of q.slice(1)) ctx.lineTo(p[0],p[1]); ctx.closePath(); ctx.stroke(); }
  }
}
function tileAt(e){
  const rc=cv.getBoundingClientRect();
  const x=(e.clientX-rc.left)*(W/rc.width), y=(e.clientY-rc.top)*(H/rc.height);
  const u=(x-ZN.ox)/(ZN.tw/2), v=(y-ZN.oy)/(ZN.tw/4);
  const c=Math.floor((u+v)/2), r=Math.floor((v-u)/2);
  return inb(c,r)?[c,r]:null;
}
function hoverHex(){
  const t=S.hover; if(!t) return;
  const c=t[0], r=t[1], hw=ZN.tw/2, hh=ZN.tw/4, tx=ZN.ox+(c-r)*hw, ty=ZN.oy+(c+r)*hh, h=S.ph;
  ctx.strokeStyle="#4fd1b5"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(tx-hw,ty+hh); ctx.lineTo(tx-hw,ty+hh-h); ctx.lineTo(tx,ty-h); ctx.lineTo(tx+hw,ty+hh-h); ctx.lineTo(tx+hw,ty+hh); ctx.lineTo(tx,ty+2*hh); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tx,ty-h); ctx.lineTo(tx+hw,ty+hh-h); ctx.lineTo(tx,ty+2*hh-h); ctx.lineTo(tx-hw,ty+hh-h); ctx.closePath(); ctx.stroke();
}
let painting=false;
function paintAt(e){
  const t=tileAt(e); S.hover=t;
  if(!t||!painting) return;
  const c=t[0], r=t[1];
  if(kind(c,r)==="#"&&!isTable(c,r)&&HT[r*COLS+c]!==S.ph){ HT[r*COLS+c]=S.ph; buildDepth(); }
}
cv.addEventListener("pointerdown",e=>{ if(!S.edit) return; painting=true; cv.setPointerCapture(e.pointerId); paintAt(e); });
cv.addEventListener("pointermove",e=>{ if(S.edit) paintAt(e); });
cv.addEventListener("pointerup",()=>{ painting=false; });
cv.addEventListener("pointerleave",()=>{ if(!painting) S.hover=null; });
$("edit").addEventListener("change",e=>{
  S.edit=e.target.checked; $("editbar").hidden=!S.edit;
  cv.style.cursor=S.edit?"crosshair":""; cv.style.touchAction=S.edit?"none":"";
});
$("copyh").addEventListener("click",()=>{
  const o={};
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(kind(c,r)==="#"&&!isTable(c,r)) o[c+","+r]=HT[r*COLS+c];

/* ---------- frame loop ---------- */
function render(tm){
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(img,0,0);
  const items=S.robots.map((b,i)=>({b,i,d:b.c+b.r,t:1}));
  S.robots.forEach(b=>{ const p=b.working&&b.actT>0.25?SPOTS[b.tc+","+b.tr]:null; if(p) items.push({b,p,d:p[0]+p[1],t:0}); });
  items.sort((a,b)=>a.d-b.d||a.t-b.t).forEach(it=>{ if(it.t===1) robot(it.b,it.i,tm); else doohickey(it,tm); });
  if(S.zones||S.edit) overlay();
  if(S.edit) hoverHex();
}
let last=0;
function frame(t){
  const dt=Math.min(0.1,(t-last)/1000||0); last=t;
  if(!S.paused) step(dt);
  render(t/1000);
  const nw=S.robots.filter(b=>b.mode==="work").length;
  const s=`${nw} working, ${S.robots.length-nw} on break`;
  const s2=(S.edit&&S.hover&&kind(S.hover[0],S.hover[1])==="#")?`${s}, tile ${S.hover[0]},${S.hover[1]}${isTable(S.hover[0],S.hover[1])?" (table, fixed shape)":" height "+HT[S.hover[1]*COLS+S.hover[0]]}`:s;
  if($("stat").textContent!==s2) $("stat").textContent=s2;
  requestAnimationFrame(frame);
}

function fit(){
  const v=+$("scale").value;
  const k=v||Math.max(1,Math.min(Math.floor((innerWidth-34)/W),Math.floor((innerHeight-90)/H)));
  cv.style.width=(W*k)+"px"; cv.style.height=(H*k)+"px";
}
$("scale").addEventListener("change",fit); addEventListener("resize",fit);
$("n").addEventListener("input",e=>{ S.n=+e.target.value; $("nv").textContent=S.n; spawn(); });
$("h").addEventListener("input",e=>{ S.ph=+e.target.value; $("hv").textContent=S.ph; });
$("zones").addEventListener("change",e=>{ S.zones=e.target.checked; });
$("play").addEventListener("click",()=>{ S.paused=!S.paused; $("play").textContent=S.paused?"Play":"Pause"; });
$("play").textContent=S.paused?"Play":"Pause";
const atlas=new Image(); let loaded=0;
function go(){ if(++loaded<4) return; buildVariants(atlas); readMask(); fit(); buildDepth(); spawn(); requestAnimationFrame(frame); }
img.onload=go; atlas.onload=go; dooImg.onload=go; maskImg.onload=go; maskImg.src=MASK_URI; atlas.src=ATLAS_URI; dooImg.src=DOO_URI; img.src=BG;
</script>
