# Runs the frontend in Vite dev mode with HMR instead of the nginx production build.
# Docker Compose loads this file automatically alongside docker-compose.yml.
# To use the production build instead, start with: docker compose -f docker-compose.yml up
services:
  frontend:
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5056:5173"
    environment:
      BACKEND_URL: http://backend:8000
    # npm ci is skipped if node_modules is already populated (volume persists between runs)
    command: sh -c "[ -d node_modules ] || npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend-node-modules:
