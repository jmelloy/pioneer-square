services:
  backend:
    build:
      context: ./backend
    ports:
      - "8056:8000"
    environment:
      DB_PATH: /data/pioneer_square.db
      DATABASE_URL: sqlite+aiosqlite:////data/pioneer_square.db
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WORKER_IMAGE: ${WORKER_IMAGE:-pioneer-square-worker}
      WORKER_BACKEND_URL: ${WORKER_BACKEND_URL:-http://backend:8000}
    volumes:
      - backend-data:/data
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5056:80"
    depends_on:
      - backend
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    image: pioneer-square-worker
    profiles: ["worker"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Provide pioneer-worker.toml at ./worker/pioneer-worker.toml
      - ./worker/pioneer-worker.toml:/config/pioneer-worker.toml:ro
      - worker-repos:/work/repos
      - worker-worktrees:/work/worktrees
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  worker-repos:
  worker-worktrees:
