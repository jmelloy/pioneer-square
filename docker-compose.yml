services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      secrets:
        - build_github_token
    ports:
      - "8056:8000"
    environment:
      DB_PATH: /data/pioneer_square.db
      DATABASE_URL: sqlite+aiosqlite:////data/pioneer_square.db
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-https://pioneer-square.melloy.life/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://pioneer-square.melloy.life}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Forwarded to spawned worker containers so they skip the interactive
      # `claude setup-token` flow. Generate one with `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WORKER_IMAGE: ${WORKER_IMAGE:-pioneer-square-worker}
      WORKER_BACKEND_URL: ${WORKER_BACKEND_URL:-http://backend:8000}
      # When set (e.g. DEBUG), backend-spawned worker containers are launched
      # with PIONEER_WORKER_LOG_LEVEL=<this value>, raising worker verbosity.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-}
      TEST_MODE: ${TEST_MODE:-}
    volumes:
      - backend-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "alembic upgrade head && python main.py"
    restart: unless-stopped

  foreman:
    build:
      context: .
      dockerfile: foreman/Dockerfile
    profiles: ["foreman"]
    environment:
      DB_PATH: /data/pioneer_square.db
      DATABASE_URL: sqlite+aiosqlite:////data/pioneer_square.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # WebSocket base URL of the backend service (no trailing slash)
      BACKEND_WS_URL: ${BACKEND_WS_URL:-ws://backend:8000}
      # 6-char guild ID this foreman instance manages (required)
      GUILD_ID: ${GUILD_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backend-data:/data
    depends_on:
      - backend
    restart: unless-stopped

  # Standalone foreman (Phase 3) — no direct DB access; uses REST API only.
  # To use this service instead of the Phase 2 foreman above, run:
  #   PIONEER_GUILD_ID=abc123 docker compose --profile pioneer-foreman up pioneer-foreman
  #
  # Provide the config either via environment variables or by mounting a
  # pioneer-foreman.toml at /config/pioneer-foreman.toml.
  pioneer-foreman:
    build:
      context: ./pioneer-foreman
    profiles: ["pioneer-foreman"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Backend base URL — ws:// or http://, foreman normalises the scheme.
      PIONEER_BACKEND_URL: ${PIONEER_BACKEND_URL:-ws://backend:8000}
      # 6-char guild ID this foreman manages (required).
      PIONEER_GUILD_ID: ${PIONEER_GUILD_ID:-}
      # Optional: pre-registered worker auth_token to skip re-registration.
      PIONEER_FOREMAN_AUTH_TOKEN: ${PIONEER_FOREMAN_AUTH_TOKEN:-}
      # Optional: GitHub token; fetched from backend at first use if absent.
      PIONEER_GITHUB_TOKEN: ${PIONEER_GITHUB_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FOREMAN_MODEL: ${FOREMAN_MODEL:-claude-sonnet-4-6}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Optional: mount a pioneer-foreman.toml for full config control.
      # - ./pioneer-foreman/pioneer-foreman.toml:/config/pioneer-foreman.toml:ro
    depends_on:
      - backend
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    image: pioneer-square-worker
    profiles: ["worker"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
    volumes:
      # Provide pioneer-worker.toml at ./worker/pioneer-worker.toml
      - ./worker/pioneer-worker.toml:/config/pioneer-worker.toml:ro
      - worker-repos:/work/repos
      - worker-worktrees:/work/worktrees
    # Re-declare the entrypoint so we can interpolate WORKER_LOG_LEVEL at compose
    # time. Run with WORKER_LOG_LEVEL=DEBUG to see verbose worker logs:
    #   WORKER_LOG_LEVEL=DEBUG docker compose --profile worker up worker
    command: pioneer-worker --config /config/pioneer-worker.toml --log-level ${WORKER_LOG_LEVEL:-INFO}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  worker-repos:
  worker-worktrees:

secrets:
  build_github_token:
    environment: BUILD_GITHUB_TOKEN
