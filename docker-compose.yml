services:
  postgres:
    image: postgres:18
    # Enable query-stats extensions. shared_preload_libraries requires a
    # server restart, so it must be set via -c rather than CREATE EXTENSION.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements,auto_explain"
      - "-c"
      - "compute_query_id=on"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "track_io_timing=on"
      - "-c"
      - "auto_explain.log_min_duration=500ms"
      - "-c"
      - "auto_explain.log_analyze=on"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pioneer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Passed into the init script so it can create the metabase role.
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-metabase-db.sh:/docker-entrypoint-initdb.d/init-metabase-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pioneer} -d ${POSTGRES_USER:-pioneer}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      args:
        # Stamps backend/worker_lifecycle.py's version check so restarts can
        # tell current-deploy workers from stale ones instead of draining
        # everything. Set PIONEER_VERSION before building, e.g.:
        #   PIONEER_VERSION=$(git rev-parse --short HEAD) docker compose build backend
        PIONEER_VERSION: ${PIONEER_VERSION:-}
      secrets:
        - build_github_token
    ports:
      - "8056:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pioneer}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_USER:-pioneer}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-https://pioneer-square.melloy.life/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://pioneer-square.melloy.life}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Forwarded to spawned worker containers so they skip the interactive
      # `claude setup-token` flow. Generate one with `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WORKER_IMAGE: ${WORKER_IMAGE:-pioneer-square-worker}
      WORKER_BACKEND_URL: ${WORKER_BACKEND_URL:-http://backend:8000}
      # When set (e.g. DEBUG), backend-spawned worker containers are launched
      # with PIONEER_WORKER_LOG_LEVEL=<this value>, raising worker verbosity.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-}
      TEST_MODE: ${TEST_MODE:-}
      PIONEER_FOREMAN_KEY: ${PIONEER_FOREMAN_KEY:-}
      # Gates the /debug/query read-only SQL endpoint (see backend/routes/debug_query.py)
      # and, when set, is forwarded into worker containers this backend spawns
      # (build_spawn_worker_env) so the worker's debug-query skill can use it too.
      DEBUG_TOKEN: ${DEBUG_TOKEN:-}
      # S3 session-log sync — forwarded to spawned worker containers.
      PIONEER_S3_BUCKET: ${PIONEER_S3_BUCKET:-}
      PIONEER_S3_PREFIX: ${PIONEER_S3_PREFIX:-}
      PIONEER_S3_SYNC_INTERVAL: ${PIONEER_S3_SYNC_INTERVAL:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # --- Discord notifications (optional, see docs/discord.md) ---
      # Bot (gateway app) drives all notifications: flat-channel embeds and
      # per-PR/issue thread notifications. Both required together; no-op when unset.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      # Phase 3: slash commands & bidirectional control.
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_ALLOWED_ROLE_IDS: ${DISCORD_ALLOWED_ROLE_IDS:-}
      DISCORD_PIONEER_GUILD_SLUG: ${DISCORD_PIONEER_GUILD_SLUG:-}
      # Task-stream mirroring: mirror each working task's live terminal output
      # into a dedicated per-task thread as silent, low-priority messages.
      # High-volume, off by default; needs DISCORD_BOT_TOKEN + DISCORD_CHANNEL_ID.
      DISCORD_STREAM_TASKS: ${DISCORD_STREAM_TASKS:-false}
      # Phase 4: persistent Gateway websocket for inbound messages. Requires
      # DISCORD_BOT_TOKEN and the "Message Content Intent" enabled on the
      # bot's Bot page in the Discord Developer Portal.
      DISCORD_GATEWAY_ENABLED: ${DISCORD_GATEWAY_ENABLED:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "cd backend && alembic upgrade head && cd .. && pioneer serve"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  foreman:
    build:
      context: .
      dockerfile: Dockerfile
      target: foreman
    command: pioneer foreman
    profiles: [ "foreman" ]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # WebSocket base URL of the backend service (no trailing slash)
      BACKEND_WS_URL: ${BACKEND_WS_URL:-ws://backend:8000}
      # 6-char guild ID this foreman instance manages (required)
      GUILD_ID: ${GUILD_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Model and provider — set FOREMAN_PROVIDER=openai for Ollama/vLLM/LM Studio,
      # or FOREMAN_PROVIDER=bedrock to use Amazon Bedrock.
      # Direct Anthropic API: FOREMAN_MODEL is a plain model ID (e.g. claude-sonnet-4-6).
      # OpenAI-compatible: FOREMAN_BASE_URL points at /v1 (e.g. http://host.docker.internal:11434/v1).
      # Amazon Bedrock: FOREMAN_BEDROCK_MODEL must be a cross-region inference profile
      # ARN scoped to *your* AWS account, e.g.:
      #   arn:aws:bedrock:us-east-1:<your-account-id>:inference-profile/us.anthropic.claude-sonnet-4-6
      # There is no safe default (profiles are account-scoped) — it's required when
      # FOREMAN_PROVIDER=bedrock; otherwise FOREMAN_MODEL is used.
      FOREMAN_MODEL: ${FOREMAN_MODEL:-claude-sonnet-4-6}
      FOREMAN_BASE_URL: ${FOREMAN_BASE_URL:-}
      FOREMAN_BEDROCK_MODEL: ${FOREMAN_BEDROCK_MODEL:-}
      FOREMAN_PROVIDER: ${FOREMAN_PROVIDER:-anthropic}
      # AWS credentials for Bedrock (ignored when FOREMAN_PROVIDER=anthropic).
      # Supply either a bearer token OR access key + secret (+ optional session token).
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: pioneer-square-worker
    profiles: [ "worker" ]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
      # Backend URL the debug-query skill posts to (see worker/skills/debug-query).
      PIONEER_BACKEND_URL: ${WORKER_BACKEND_URL:-http://backend:8000}
      # Same operator credential as the backend's DEBUG_TOKEN (see above) — set
      # this to the same value so the worker's debug-query skill can call
      # /debug/query. Leave unset to disable the skill.
      DEBUG_TOKEN: ${DEBUG_TOKEN:-}
      PIONEER_S3_BUCKET: ${PIONEER_S3_BUCKET:-}
      PIONEER_S3_PREFIX: ${PIONEER_S3_PREFIX:-}
      PIONEER_S3_SYNC_INTERVAL: ${PIONEER_S3_SYNC_INTERVAL:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      # Provide pioneer-worker.toml at ./worker/pioneer-worker.toml
      - ./worker/pioneer-worker.toml:/config/pioneer-worker.toml:ro
      - worker-repos:/work/repos
      - worker-worktrees:/work/worktrees
    # Re-declare the entrypoint so we can interpolate WORKER_LOG_LEVEL at compose
    # time. Run with WORKER_LOG_LEVEL=DEBUG to see verbose worker logs:
    #   WORKER_LOG_LEVEL=DEBUG docker compose --profile worker up worker
    command: pioneer worker --config /config/pioneer-worker.toml --log-level ${WORKER_LOG_LEVEL:-INFO}
    depends_on:
      - backend
    restart: unless-stopped

  pgweb:
    image: metabase/metabase:latest
    profiles: [ "tools" ]
    ports:
      - "${PGWEB_PORT:-8081}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      # METABASE_DB_PASSWORD must be explicitly set before starting the tools profile.
      # It is also used by the postgres init script to create the dedicated metabase role.
      # If unset, Metabase will fail to connect to its backing database.
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_DBNAME: metabase
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres-test:
    image: postgres:18
    profiles: [ "test" ]
    environment:
      POSTGRES_DB: pioneer_test
      POSTGRES_USER: pioneer
      POSTGRES_PASSWORD: pioneer_password
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pioneer" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  worker-repos:
  worker-worktrees:

secrets:
  build_github_token:
    environment: BUILD_GITHUB_TOKEN
